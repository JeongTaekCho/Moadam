server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,text/html,text/plain,text/css,application/javascript
  error:
    include-message: never
spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
  task:
    scheduling:
      pool:
        size: 2
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 5000
      validation-timeout: 1000
      initialization-fail-timeout: -1
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
app:
  document-jobs:
    enabled: ${DOCUMENT_JOBS_ENABLED:true}
  documents:
    max-count: ${DOCUMENT_MAX_COUNT:100}
    max-bytes: ${DOCUMENT_MAX_BYTES:209715200}
    daily-index-limit: ${DOCUMENT_DAILY_INDEX_LIMIT:20}
    daily-upload-limit: ${DOCUMENT_DAILY_UPLOAD_LIMIT:20}
  issuer: ${SUPABASE_URL}/auth/v1
  audience: authenticated
  jwt-secret: ${SUPABASE_JWT_SECRET:}
  cors: ${CORS_ORIGINS:http://localhost:3000}
  supabase: ${SUPABASE_URL}
  storage-key: ${SUPABASE_SERVICE_ROLE_KEY}
  rag-url: ${RAG_URL:http://localhost:8000}
  rag-token: ${RAG_INTERNAL_TOKEN}

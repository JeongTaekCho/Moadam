name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - run: pnpm install --frozen-lockfile
      - run: make -C .. frontend-check
      - run: pnpm test:cache && pnpm test:db && pnpm test:events
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:oauth && pnpm test:chat-stream && pnpm test:ai-errors && pnpm test:performance && pnpm test:events-ui && pnpm test:discussion-ui
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B verify
        working-directory: backend
  rag-and-guides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            rag/requirements.lock
            rag/requirements-dev.txt
      - run: python -m pip install -r rag/requirements-dev.txt
      - run: python -m ruff check rag scripts --config rag/pyproject.toml
      - run: python -m ruff format --check rag scripts --config rag/pyproject.toml
      - run: python scripts/check-conventions.py && python scripts/check-migrations.py
      - run: python -m unittest discover -s tests -v
        working-directory: rag

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img"><title>질문 → 근거 검색 → 답변 확정</title><desc>검색 전에 권한과 문서 범위를 적용하고, 답변이 끝난 뒤 실제 인용 청크를 다시 검사합니다.</desc><rect width="1600" height="1080" fill="#FCFAF7"/>
<text x="40" y="49.94" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="17" font-weight="700" fill="#E76825">MOADAM / AI ENGINEERING</text>
<text x="40" y="109.16" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="38" font-weight="700" fill="#302923">질문 → 근거 검색 → 답변 확정</text>
<text x="40" y="147.4" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="20" font-weight="400" fill="#73685F">검색 전에 권한과 문서 범위를 적용하고, 답변이 끝난 뒤 실제 인용 청크를 다시 검사합니다.</text>
<rect x="40" y="200" width="330" height="220" rx="18" fill="#FFFFFF" stroke="#E8DFD5"/>
<rect x="60" y="220" width="38" height="32" rx="9" fill="#FFF1E6" stroke="#FFF1E6"/>
<text x="70" y="239.94" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="17" font-weight="700" fill="#E76825">1</text>
<text x="60" y="289.5" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#302923">질문과 개인 세션</text>
<text x="60" y="326.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">현재 질문: 최대 4,000자</text>
<text x="60" y="355.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">새 대화는 세션 먼저 생성</text>
<text x="60" y="384.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">과거 대화는 모델에 미전달</text>
<rect x="425" y="200" width="330" height="220" rx="18" fill="#FFFFFF" stroke="#E8DFD5"/>
<rect x="445" y="220" width="38" height="32" rx="9" fill="#FFF1E6" stroke="#FFF1E6"/>
<text x="455" y="239.94" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="17" font-weight="700" fill="#E76825">2</text>
<text x="445" y="289.5" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#302923">권한 · 범위 확인</text>
<text x="445" y="326.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">Spring: 모임 + 세션 소유자</text>
<text x="445" y="355.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">RAG: DB에서 다시 확인</text>
<text x="445" y="384.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">현재 ready 문서 ID만 전달</text>
<rect x="810" y="200" width="330" height="220" rx="18" fill="#FFFFFF" stroke="#E8DFD5"/>
<rect x="830" y="220" width="38" height="32" rx="9" fill="#FFF1E6" stroke="#FFF1E6"/>
<text x="840" y="239.94" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="17" font-weight="700" fill="#E76825">3</text>
<text x="830" y="289.5" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#302923">질문 벡터와 검색</text>
<text x="830" y="326.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">질문을 1,536차원으로 변환</text>
<text x="830" y="355.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">SQL에서 모임 / 버전 필터</text>
<text x="830" y="384.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">코사인 거리 순 상위 5개</text>
<rect x="1195" y="200" width="330" height="220" rx="18" fill="#FFFFFF" stroke="#E8DFD5"/>
<rect x="1215" y="220" width="38" height="32" rx="9" fill="#FFF1E6" stroke="#FFF1E6"/>
<text x="1225" y="239.94" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="17" font-weight="700" fill="#E76825">4</text>
<text x="1215" y="289.5" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#302923">근거 프롬프트</text>
<text x="1215" y="326.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">질문 + untrusted_excerpts</text>
<text x="1215" y="355.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">제목 / 페이지 / 청크 ID 포함</text>
<text x="1215" y="384.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">제공된 발췌로만 답변 지시</text>
<polyline points="370,310 425,310" fill="none" stroke="#E76825" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="425.00,310.00 414.36,315.54 414.36,304.46" fill="#E76825"/>
<polyline points="755,310 810,310" fill="none" stroke="#E76825" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="810.00,310.00 799.36,315.54 799.36,304.46" fill="#E76825"/>
<polyline points="1140,310 1195,310" fill="none" stroke="#E76825" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="1195.00,310.00 1184.36,315.54 1184.36,304.46" fill="#E76825"/>
<rect x="40" y="565" width="330" height="220" rx="18" fill="#FFFFFF" stroke="#E8DFD5"/>
<rect x="60" y="585" width="38" height="32" rx="9" fill="#FFF1E6" stroke="#FFF1E6"/>
<text x="70" y="604.94" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="17" font-weight="700" fill="#E76825">8</text>
<text x="60" y="654.5" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#302923">화면 확정</text>
<text x="60" y="691.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">저장된 메시지 ID로 교체</text>
<text x="60" y="720.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">완료 후 Markdown과 출처</text>
<text x="60" y="749.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">미완성 초안은 실패 시 제거</text>
<rect x="425" y="565" width="330" height="220" rx="18" fill="#FFFFFF" stroke="#E8DFD5"/>
<rect x="445" y="585" width="38" height="32" rx="9" fill="#FFF1E6" stroke="#FFF1E6"/>
<text x="455" y="604.94" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="17" font-weight="700" fill="#E76825">7</text>
<text x="445" y="654.5" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#302923">질문 · 답변 저장</text>
<text x="445" y="691.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">Spring이 세션 권한 재검사</text>
<text x="445" y="720.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">한 DB 트랜잭션으로 저장</text>
<text x="445" y="749.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">완료 메시지 2개를 반환</text>
<rect x="810" y="565" width="330" height="220" rx="18" fill="#FFFFFF" stroke="#E8DFD5"/>
<rect x="830" y="585" width="38" height="32" rx="9" fill="#FFF1E6" stroke="#FFF1E6"/>
<text x="840" y="604.94" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="17" font-weight="700" fill="#E76825">6</text>
<text x="830" y="654.5" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#302923">인용 재검증</text>
<text x="830" y="691.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">검색된 실제 청크 ID만 선택</text>
<text x="830" y="720.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">모임 / 현재 버전 / ready 확인</text>
<text x="830" y="749.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">변경·근거 없음이면 유보</text>
<rect x="1195" y="565" width="330" height="220" rx="18" fill="#FFFFFF" stroke="#E8DFD5"/>
<rect x="1215" y="585" width="38" height="32" rx="9" fill="#FFF1E6" stroke="#FFF1E6"/>
<text x="1225" y="604.94" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="17" font-weight="700" fill="#E76825">5</text>
<text x="1215" y="654.5" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#302923">모델 스트리밍</text>
<text x="1215" y="691.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">gpt-4.1-mini, stream=true</text>
<text x="1215" y="720.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">JSON answer를 먼저 출력</text>
<text x="1215" y="749.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">본문 조각은 즉시 전달</text>
<polyline points="1360,420 1360,565" fill="none" stroke="#E76825" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="1360.00,565.00 1354.46,554.36 1365.54,554.36" fill="#E76825"/>
<text x="1380" y="499.76" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="18" font-weight="400" fill="#E76825">생성 요청</text>
<polyline points="1195,675 1140,675" fill="none" stroke="#E76825" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="1140.00,675.00 1150.64,669.46 1150.64,680.54" fill="#E76825"/>
<polyline points="810,675 755,675" fill="none" stroke="#E76825" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="755.00,675.00 765.64,669.46 765.64,680.54" fill="#E76825"/>
<polyline points="425,675 370,675" fill="none" stroke="#E76825" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="370.00,675.00 380.64,669.46 380.64,680.54" fill="#E76825"/>
<rect x="40" y="835" width="1490" height="125" rx="18" fill="#FFF1E6" stroke="#F4D7C0"/>
<text x="62" y="871.04" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="22" font-weight="700" fill="#302923">검색과 정답성은 구분합니다</text>
<text x="62" y="905.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">OpenAI 모드: 고정 0.3 임계값 없이 가까운 후보를 전달합니다. 0.3은 mock 검색에만 적용됩니다.</text>
<text x="62" y="935.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">grounded와 인용 ID 검사는 출처 연결을 검증합니다. 답변의 모든 문장이 사실임을 보증하는 검사는 아닙니다.</text>
<text x="40" y="1062.3" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="15" font-weight="400" fill="#73685F">코드 기준: 2026-10-08 · 흐름도는 구현을 설명하며 운영 배포 구성을 보증하지 않습니다.</text>
</svg>
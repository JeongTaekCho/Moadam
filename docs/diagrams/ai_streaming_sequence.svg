<text x="62" y="1250.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">delta는 생성 중 초안입니다. 최종 인용·권한을 검증하고 저장한 뒤 done으로 확정합니다.</text>

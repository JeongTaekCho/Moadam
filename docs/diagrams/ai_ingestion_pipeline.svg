<rect x="830" y="220" width="38" height="32" rx="9" fill="#FFF1E6" stroke="#FFF1E6"/>
<text x="840" y="239.94" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="17" font-weight="700" fill="#E76825">3</text>
<text x="830" y="289.5" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#302923">청크 분할</text>
<text x="830" y="326.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">페이지별 1,000자</text>
<text x="830" y="355.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">겹침 150자 / 간격 850자</text>
<text x="830" y="384.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">빈 청크 제거 · 최대 1,000개</text>
<rect x="1195" y="200" width="330" height="220" rx="18" fill="#FFFFFF" stroke="#E8DFD5"/>

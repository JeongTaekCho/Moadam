<text x="62" y="905.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">pending → processing → ready / failed · 메모 본문 수정 시 version + 1, pending으로 전환됩니다.</text>
<text x="62" y="935.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">등록 시 색인을 동기 호출합니다. 메모 수정 후에는 다시 처리가 필요하며 별도 작업 큐는 없습니다.</text>

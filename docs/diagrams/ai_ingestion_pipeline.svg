<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img"><title>자료 등록 → 검색 가능한 지식</title><desc>PDF와 메모는 같은 색인 단계로 합쳐지며, 현재 문서 버전의 청크만 검색에 사용합니다.</desc><rect width="1600" height="1080" fill="#FCFAF7"/>
<text x="40" y="49.94" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="17" font-weight="700" fill="#E76825">MOADAM / AI ENGINEERING</text>
<text x="40" y="109.16" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="38" font-weight="700" fill="#302923">자료 등록 → 검색 가능한 지식</text>
<text x="40" y="147.4" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="20" font-weight="400" fill="#73685F">PDF와 메모는 같은 색인 단계로 합쳐지며, 현재 문서 버전의 청크만 검색에 사용합니다.</text>
<rect x="40" y="200" width="330" height="220" rx="18" fill="#FFFFFF" stroke="#E8DFD5"/>
<rect x="60" y="220" width="38" height="32" rx="9" fill="#FFF1E6" stroke="#FFF1E6"/>
<text x="70" y="239.94" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="17" font-weight="700" fill="#E76825">1</text>
<text x="60" y="289.5" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#302923">등록과 업로드</text>
<text x="60" y="326.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">관리자 / 소유자만 등록</text>
<text x="60" y="355.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">PDF: 서명 URL에 PUT</text>
<text x="60" y="384.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">메모: DB에 본문 저장</text>
<rect x="425" y="200" width="330" height="220" rx="18" fill="#FFFFFF" stroke="#E8DFD5"/>
<rect x="445" y="220" width="38" height="32" rx="9" fill="#FFF1E6" stroke="#FFF1E6"/>
<text x="455" y="239.94" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="17" font-weight="700" fill="#E76825">2</text>
<text x="445" y="289.5" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#302923">원본 읽기</text>
<text x="445" y="326.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">PDF: 비공개 Storage 검증</text>
<text x="445" y="355.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">pypdf로 페이지별 텍스트</text>
<text x="445" y="384.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">메모: text_content 사용</text>

<text x="1215" y="289.5" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#302923">임베딩 생성</text>
<text x="1215" y="326.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">32개씩 Embeddings 호출</text>
<text x="1215" y="355.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">text-embedding-3-small</text>

<text x="445" y="691.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">청크 저장과 상태 변경 함께</text>
<text x="445" y="720.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">실패: 같은 버전 청크 유지</text>
<text x="445" y="749.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">새 버전 실패: failed 상태</text>
<rect x="810" y="565" width="330" height="220" rx="18" fill="#FFFFFF" stroke="#E8DFD5"/>
<rect x="830" y="585" width="38" height="32" rx="9" fill="#FFF1E6" stroke="#FFF1E6"/>
<text x="840" y="604.94" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="17" font-weight="700" fill="#E76825">6</text>
<text x="830" y="654.5" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="25" font-weight="700" fill="#302923">버전 잠금과 교체</text>
<text x="830" y="691.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">권한을 다시 검사</text>
<text x="830" y="720.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">문서 행 SELECT FOR UPDATE</text>
<text x="830" y="749.58" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif" font-size="19" font-weight="400" fill="#73685F">같은 트랜잭션에서 청크 교체</text>

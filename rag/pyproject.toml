[project]
name = "moadam-rag"
version = "0.1.0"
description = "Internal group-scoped retrieval and AI answers for Moadam"
requires-python = ">=3.12,<3.13"
# Mirror requirements.lock so Docker and Vercel use the same runtime versions.
dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "certifi==2026.7.22",
    "click==8.5.0",
    "fastapi==0.135.1",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.20",
    "psycopg==3.3.3",
    "psycopg-binary==3.3.3",
    "pydantic==2.13.5",
    "pydantic-core==2.46.5",
    "pydantic-settings==2.13.1",
    "pypdf==6.8.0",
    "python-dotenv==1.2.4",
    "starlette==1.7.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "uvicorn==0.41.0",
    "charset-normalizer==3.5.2",
    "regex==2026.9.29",
    "requests==2.34.2",
    "tiktoken==0.12.0",
    "urllib3==2.8.0",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "app:app"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app", "token_usage", "answer_format", "group_context"]

[tool.ruff.lint.per-file-ignores]
# Test configuration must be set before importing the ASGI module.
"tests/test_rag.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

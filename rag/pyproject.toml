[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Test configuration must be set before importing the ASGI module.
"tests/test_rag.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
